# 构建并推送镜像到 GitHub Container Registry (ghcr.io) 或 Docker Hub。
#
# 默认只推 ghcr.io，使用仓库自带的 GITHUB_TOKEN，不需要额外 secret。
# 推 Docker Hub 前，在仓库 Settings → Secrets and variables → Actions 里添加：
#   DOCKERHUB_USERNAME  Docker Hub 用户名
#   DOCKERHUB_TOKEN     Access Token（不要用账号密码）
# 并把下面 env.dockerhub 改成 true。
#
# 镜像名：ghcr.io/<owner>/<repo>，以及（启用后）<DOCKERHUB_USERNAME>/<repo>。
# 标签：主分支推送打 latest 和提交短 SHA；打 v* tag 时另外打对应的版本号。
# workflow_dispatch 只构建不推送，用于先确认 Dockerfile 能过。
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # 改成 true 后会同时推送到 Docker Hub（需要上面说明的两个 secret）
  dockerhub: "false"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide registries and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]'; }
          repo="$(lower "${GITHUB_REPOSITORY##*/}")"
          owner="$(lower "${GITHUB_REPOSITORY_OWNER}")"
          push="${{ github.event_name != 'workflow_dispatch' }}"

          images="$(mktemp)"
          tags="$(mktemp)"
          trap 'rm -f "${images}" "${tags}"' EXIT

          echo "ghcr.io/${owner}/${repo}" >> "${images}"
          if [ "${{ env.dockerhub }}" = "true" ]; then
            hub_user="$(lower "${{ secrets.DOCKERHUB_USERNAME }}")"
            if [ -z "${hub_user}" ]; then
              echo "dockerhub 已启用但没有配置 DOCKERHUB_USERNAME secret" >&2
              exit 1
            fi
            echo "${hub_user}/${repo}" >> "${images}"
          fi

          while IFS= read -r image; do
            [ -z "${image}" ] && continue
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "${image}:${GITHUB_REF_NAME#v}" >> "${tags}"
              echo "${image}:${GITHUB_REF_NAME}" >> "${tags}"
            else
              echo "${image}:latest" >> "${tags}"
              echo "${image}:sha-${GITHUB_SHA::7}" >> "${tags}"
            fi
          done < "${images}"

          {
            echo "push=${push}"
            echo "tags<<EOF"
            cat "${tags}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.push == 'true' && env.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
